# Build the Jarvis tablet debug APK on every push to main (and on PRs).
# This is how the app gets built without Tailscale and without the Mac
# Mini: code is written in the cloud, CI compiles it, and the APK comes
# back as a downloadable artifact. Sideloading it onto the tablet still
# needs LAN adb (scripts/adb-install.sh) — that part is not CI's job.
name: Build APK

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      # HUD fonts are binary TTFs and are not committed to the repo;
      # fetch them from Google Fonts (OFL) so the CI APK has the real
      # Rajdhani / Share Tech Mono faces instead of fallback fonts.
      - name: Fetch HUD fonts (OFL, Google Fonts)
        run: |
          mkdir -p app/src/main/assets/web/fonts
          base="https://github.com/google/fonts/raw/main"
          curl -sL "$base/ofl/rajdhani/Rajdhani-Regular.ttf" -o app/src/main/assets/web/fonts/Rajdhani-Regular.ttf
          curl -sL "$base/ofl/rajdhani/Rajdhani-Medium.ttf" -o app/src/main/assets/web/fonts/Rajdhani-Medium.ttf
          curl -sL "$base/ofl/rajdhani/Rajdhani-SemiBold.ttf" -o app/src/main/assets/web/fonts/Rajdhani-SemiBold.ttf
          curl -sL "$base/ofl/rajdhani/Rajdhani-Bold.ttf" -o app/src/main/assets/web/fonts/Rajdhani-Bold.ttf
          curl -sL "$base/ofl/sharetechmono/ShareTechMono-Regular.ttf" -o app/src/main/assets/web/fonts/ShareTechMono.ttf
          ls -l app/src/main/assets/web/fonts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          # v3's default package set included the obsolete `tools` package
          # (Google removed it; CI failed with "Failed to find package
          # 'tools'", issue #1). v4 defaults to platform-tools only, so
          # install the platform + build-tools Gradle needs explicitly.
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      # Issues #8 / #14: every CI run used to sign the debug APK with a
      # fresh auto-generated debug key (a new ubuntu-latest runner has no
      # ~/.android/debug.keystore), so `adb install -r` failed with
      # INSTALL_FAILED_UPDATE_INCOMPATIBLE on every new build — and the
      # 9fb16b3 retest is blocked because wiping would destroy the saved
      # ContextForge bearer. AGP signs debug builds with
      # ~/.android/debug.keystore when it already exists, so restore one
      # stable key from the DEBUG_KEYSTORE_BASE64 repo secret (see
      # docs/signing.md for the one-time setup). This step FAILS HARD when
      # the secret is missing, so a missing secret can never silently
      # ship another mismatched APK.
      - name: Restore stable debug keystore (issues #8/#14)
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "ERROR: DEBUG_KEYSTORE_BASE64 secret is not set."
            echo "See docs/signing.md — generate the debug keystore once and"
            echo "add it as a repo secret, then re-run this workflow."
            exit 1
          fi
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
          keytool -list -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey >/dev/null \
            || { echo "ERROR: decoded keystore is invalid (expected alias androiddebugkey, storepass android)"; exit 1; }
          echo "stable debug keystore restored"
          # Issue #18: the signer drifted between 581e980 and 21fc9c9
          # even though both runs logged the restore. Print the
          # keystore's SHA-256 fingerprint so every run logs exactly
          # which key signed the APK — a drift is then visible in the
          # log instead of only on the tablet at install time.
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey \
            | grep -E "SHA256:|Alias name:"
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      # Issue #3: the Mini-built APK crashed on launch with
      # NoClassDefFoundError for androidx.appcompat.R$drawable. The Gradle
      # APK should include it (AGP packages library R classes), but fail
      # CI loudly here if it ever goes missing instead of shipping a
      # broken APK to the tablet.
      - name: Verify APK dex (issue #3)
        run: |
          apk="app/build/outputs/apk/debug/app-debug.apk"
          # A byte-substring grep FALSE-PASSES (issue #5): any class
          # referencing R$drawable puts its descriptor in the dex string
          # table without the class being defined. Check the real class
          # definitions with dexdump instead. Gradle splits the APK into
          # several dex files (app classes land in classes3.dex), so check
          # every classes*.dex, not just the first.
          dexdump="$ANDROID_HOME/build-tools/34.0.0/dexdump"
          mkdir -p /tmp/dexcheck && cd /tmp/dexcheck && unzip -o -q "$GITHUB_WORKSPACE/android/$apk" 'classes*.dex'
          for cls in 'Landroidx/appcompat/R$drawable;' 'Lnet/npalakurla/jarvis/tablet/MainActivity;'; do
            found=0
            for dex in classes*.dex; do
              if "$dexdump" -f "$dex" 2>/dev/null | grep "Class descriptor" | grep -q -F "$cls"; then found=1; break; fi
            done
            if [ "$found" = 0 ]; then echo "MISSING class_def: $cls"; exit 1; fi
          done
          echo "dex verification: required classes defined"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-tablet-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
